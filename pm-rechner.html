<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PM-Rechner">
<meta name="theme-color" content="#0e1424">
<title>PM-Rechner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  :root { --bg: #0e1424; --card: #172036; --card2: #1f2b48; --line: #2e3d66; --txt: #eef2ff; --mut: #8e9cc7; --acc: #6c7bff; --good: #4cf0a0; --warn: #ffb340; --bad: #ff5d73; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; height: 100dvh; color: var(--txt); background: radial-gradient(circle at 50% 0, #1b2749, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
  button, input, select, textarea { font-family: inherit; color: inherit; border: 0; }
  button { cursor: pointer; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .top h1 { font-size: 20px; font-weight: 900; flex: 1; }
  .ibtn { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; font-size: 18px; text-decoration: none; color: var(--txt); }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 3px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 9px 2px; border-radius: 11px; background: none; font-size: 12px; font-weight: 800; color: var(--mut); }
  .tabs button.on { background: var(--acc); color: #fff; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; min-height: 0; padding-bottom: 12px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .lbl { font-size: 11px; font-weight: 900; letter-spacing: 1.2px; color: var(--mut); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .lbl .sp { flex: 1; } .lbl .cnt { color: var(--acc); letter-spacing: 0; }
  .help { font-size: 12px; color: var(--mut); line-height: 1.45; margin-bottom: 8px; }
  input, select, textarea { width: 100%; padding: 11px 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 16px; min-width: 0; }
  textarea { resize: vertical; min-height: 44px; line-height: 1.4; field-sizing: content; max-height: 40vh; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--acc); }
  .f { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .f span { font-size: 10px; font-weight: 800; letter-spacing: .8px; color: var(--mut); text-transform: uppercase; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
  .x { flex: 0 0 34px; height: 42px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--mut); font-size: 14px; }
  .add { width: 100%; padding: 11px; border-radius: 12px; background: var(--card2); border: 1px dashed var(--line); font-size: 14px; font-weight: 800; color: var(--acc); }
  .res { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .res .r { background: var(--card2); border-radius: 12px; padding: 10px; text-align: center; }
  .res .r b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; } .res .r span { font-size: 10px; letter-spacing: 1px; font-weight: 800; color: var(--mut); text-transform: uppercase; }
  .res .r.hl { background: linear-gradient(135deg, #3a4bd6, #7b56e0); } .res .r.hl span { color: #dfe3ff; }
  .res .r.w { grid-column: span 2; }
  .note { font-size: 13px; line-height: 1.5; margin-top: 8px; padding: 10px; border-radius: 12px; background: rgba(108,123,255,.12); border: 1px solid rgba(108,123,255,.4); }
  .note.warn { background: rgba(255,179,64,.12); border-color: var(--warn); } .note.bad { background: rgba(255,93,115,.12); border-color: var(--bad); } .note.good { background: rgba(76,240,160,.1); border-color: var(--good); }
  svg { width: 100%; height: auto; display: block; }
  /* Risiko */
  .heat { display: grid; grid-template-columns: 22px repeat(5, 1fr); gap: 3px; }
  .heat .c { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
  .heat .ax { font-size: 10px; color: var(--mut); display: grid; place-items: center; font-weight: 800; }
  .rk { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; }
  .rk .sc { min-width: 34px; text-align: center; border-radius: 9px; padding: 4px 0; font-weight: 900; color: #101424; }
  .rk b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk small { color: var(--mut); font-size: 11px; }
  #vl { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .seg { display: flex; gap: 4px; } .seg button { flex: 1; padding: 9px 0; border-radius: 9px; background: var(--card2); font-size: 13px; font-weight: 800; color: var(--mut); }
  .seg button.on { background: var(--acc); color: #fff; }

  /* ---- Schätzungen ---- */
  .btn { width: 100%; padding: 13px; border-radius: 13px; font-size: 15px; font-weight: 900; background: linear-gradient(135deg, #5b6cff, #8a5cff); color: #fff; }
  .btn.sec { background: var(--card2); border: 1px solid var(--line); }
  .btn.red { background: rgba(255,93,115,.14); border: 1px solid var(--bad); color: var(--bad); }
  .btn:active, .sm:active { transform: scale(.98); }
  .sm { padding: 8px 11px; border-radius: 10px; font-size: 13px; font-weight: 800; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; }
  .sm.go { background: var(--acc); border-color: var(--acc); color: #fff; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .bar .sm { flex: 1; }
  .est { display: block; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; }
  .est .h { display: flex; gap: 8px; align-items: baseline; } .est .h b { flex: 1; font-size: 15px; min-width: 0; }
  .est .v { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .est small { display: block; color: var(--mut); font-size: 12px; margin-top: 3px; }
  .pill { font-size: 10.5px; font-weight: 900; padding: 2px 7px; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap; letter-spacing: .3px; }
  .proj { font-size: 13px; font-weight: 900; margin: 14px 0 8px; display: flex; gap: 8px; align-items: center; color: var(--mut); }
  .proj:first-child { margin-top: 0; }
  .task { border: 1px solid var(--line); border-radius: 13px; padding: 10px; margin-bottom: 8px; background: rgba(0,0,0,.12); }
  .task .tg { display: grid; grid-template-columns: 1fr 1fr 1fr 64px; gap: 6px; align-items: end; }
  .task .ev { text-align: center; font-weight: 900; font-variant-numeric: tabular-nums; padding-bottom: 10px; font-size: 15px; }
  .task .ev small { display: block; font-size: 9px; color: var(--mut); letter-spacing: .8px; }
  .task .acts { display: flex; gap: 6px; margin-left: auto; }
  .task .acts button { background: rgba(255,255,255,.07); border-radius: 9px; width: 34px; height: 34px; color: var(--mut); font-size: 14px; }
  .task .sug { font-size: 12px; margin-top: 6px; padding: 7px 9px; border-radius: 10px; background: rgba(76,240,160,.08); border: 1px solid rgba(76,240,160,.35); display: flex; gap: 8px; align-items: center; }
  .task .sug span { flex: 1; } .task .sug button { font-size: 12px; font-weight: 900; color: var(--good); background: none; }
  .story { border-left: 3px solid var(--acc); padding: 8px 10px; margin-bottom: 8px; background: rgba(108,123,255,.08); border-radius: 0 12px 12px 0; display: flex; gap: 8px; }
  .story .t { flex: 1; font-size: 14px; line-height: 1.4; } .story .t small { display: block; color: var(--mut); font-size: 11.5px; margin-top: 4px; }
  .story .id { font-weight: 900; color: var(--acc); font-size: 12px; }
  .xr { display: grid; grid-template-columns: 26px 1fr 74px 70px 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .xr input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--acc); }
  .xr .amt { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--mut); }
  .xr .x { height: 34px; flex-basis: 30px; }
  .sumt { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .sumt td { padding: 6px 4px; border-bottom: 1px solid var(--line); } .sumt td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sumt tr.tot td { font-weight: 900; font-size: 14px; border-bottom: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chips button { padding: 7px 11px; border-radius: 11px; background: var(--card2); border: 1px solid var(--line); font-size: 13px; font-weight: 800; }
  .chips button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .pick { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pick input { width: 20px; height: 20px; flex: none; accent-color: var(--acc); margin-top: 2px; }
  .pick div { flex: 1; min-width: 0; } .pick small { display: block; color: var(--mut); font-size: 12px; margin-top: 2px; }
  .pick .v { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ov { position: absolute; inset: 0; z-index: 50; background: rgba(4,8,20,.78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: none; align-items: flex-end; justify-content: center; }
  .ov.on { display: flex; }
  .sheet { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; touch-action: pan-y; background: #141c31; border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); animation: up .25s; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
  .preview { font-size: 15px; line-height: 1.45; padding: 10px 12px; border-radius: 12px; background: rgba(108,123,255,.12); border: 1px solid rgba(108,123,255,.4); margin-bottom: 10px; }
  #toast { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); background: #000e; border: 1px solid var(--acc); border-radius: 12px; padding: 9px 14px; font-size: 13px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 70; max-width: 90%; text-align: center; }
  #toast.on { opacity: 1; }
  .empty { text-align: center; padding: 26px 10px; color: var(--mut); font-size: 14px; line-height: 1.5; }
  .empty .e { font-size: 46px; }
  .back { background: none; color: var(--acc); font-weight: 900; font-size: 14px; padding: 2px 0 10px; }

  /* ---- Breite Bildschirme (iPad, Notebook) ---- */
  @media (min-width: 760px) {
    #app { max-width: 1240px; width: 100%; margin: 0 auto; padding-left: calc(24px + env(safe-area-inset-left)); padding-right: calc(24px + env(safe-area-inset-right)); }
    .top { margin-bottom: 14px; } .top h1 { font-size: 26px; } .ibtn { width: 44px; height: 44px; }
    .tabs { max-width: 640px; } .tabs button { font-size: 14px; padding: 11px 2px; }
    #sc { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 14px; align-content: start; align-items: start; padding-bottom: 18px; }
    #sc > * { margin: 0 !important; min-width: 0; }
    #sc > .wide { grid-column: 1 / -1; }
    #sc.ed { grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); }
    #sc.ed > .side { grid-column: 2; grid-row: 2 / span 6; position: sticky; top: 0; }
    #sc.ed > .main { grid-column: 1; }
    .task .tg { grid-template-columns: 1fr 1fr 1fr 80px; }
    .heat { max-width: 420px; margin: 0 auto; }
    .ov { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="top"><a class="ibtn" href="index.html" aria-label="Zurück">←</a><h1 style="flex:1">🧮 PM-Rechner</h1><button class="ibtn" id="syncb" aria-label="Sync und Backup">☁️</button><button class="ibtn" id="reset" aria-label="Zurücksetzen">↺</button></div>
  <div class="tabs" id="tabs">
    <button data-t="est">Schätzung</button><button data-t="cap">Kapazität</button><button data-t="fc">Prognose</button><button data-t="risk">Risiken</button>
  </div>
  <div class="scroll" id="sc"></div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="sync.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'pmRechner.v1';
  const uid = () => Math.random().toString(36).slice(2, 9);
  const EXTRAS = () => [
    { id: uid(), n: 'Projektmanagement', type: 'pct', v: 10, on: true }, { id: uid(), n: 'Kommunikation & Abstimmung', type: 'pct', v: 5, on: true },
    { id: uid(), n: 'Test & Qualitätssicherung', type: 'pct', v: 10, on: false }, { id: uid(), n: 'Dokumentation', type: 'pct', v: 5, on: false },
    { id: uid(), n: 'Einarbeitung / Setup', type: 'fix', v: 0, on: false }
  ];
  const DEF = () => ({
    tab: 'est',
    est: { projects: [], estimates: [], lib: { tasks: [], stories: [] }, view: 'list', cur: null, q: '' },
    cap: { days: 10, focus: 70, members: [{ n: 'Anna', av: 100, off: 0 }, { n: 'Ben', av: 100, off: 2 }, { n: 'Cem', av: 80, off: 0 }, { n: 'Dana', av: 100, off: 0 }], refVel: '', refPt: '' },
    fc: { backlog: 120, velos: [22, 25, 19, 27], weeks: 2, start: new Date().toISOString().slice(0, 10), growth: 0 },
    risk: { list: [{ n: 'Schlüsselperson fällt aus', w: 2, a: 5 }, { n: 'Schnittstelle verspätet sich', w: 4, a: 3 }] }
  });
  let st = DEF();
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) st = Object.assign(DEF(), s); } catch (e) {}
  // Alte PERT-Liste (Version 1) als erste gespeicherte Schätzung übernehmen
  function migrate() {
    if (st.tab === 'pert') st.tab = 'est';
    const P = st.pert; delete st.pert;
    st.est = Object.assign(DEF().est, st.est || {});
    if (P && P.tasks && P.tasks.length && !(P.tasks.length === 2 && P.tasks[0].n === 'Aufgabe A' && P.tasks[1].n === 'Aufgabe B')) {
      st.est.estimates.push(newEstimate({ title: 'Bisherige PERT-Schätzung', unit: P.unit || 'Tage',
        tasks: P.tasks.map(t => ({ id: uid(), n: t.n, d: '', sid: '', o: t.o, m: t.m, p: t.p })), extras: EXTRAS().map(x => Object.assign(x, { on: false })) }));
    }
  }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} if (window.AppSync && !persist.quiet) AppSync.changed(); };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const n = v => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; };
  const f1 = x => (Math.round(x * 10) / 10).toLocaleString('de-DE');
  const f0 = x => Math.round(x).toLocaleString('de-DE');
  const fd = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const today = () => new Date().toISOString().slice(0, 10);
  const fds = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
  const sc = $('sc');
  let toastT;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }
  function sheet(html, wire) { $('sheet').innerHTML = html; $('ov').classList.add('on'); $('sheet').scrollTop = 0; wire && wire(); $('ov').onclick = e => { if (e.target === $('ov')) closeSheet(); }; }
  function closeSheet() { $('ov').classList.remove('on'); }

  function tabs() {
    document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === st.tab); b.onclick = () => { st.tab = b.dataset.t; persist(); tabs(); view(); }; });
    $('reset').style.visibility = st.tab === 'est' ? 'hidden' : 'visible';
  }
  function view() { sc.scrollTop = 0; sc.className = 'scroll'; ({ est: estView, cap: capView, fc: fcView, risk: riskView })[st.tab](); }

  // ================= Schätzungen =================
  const E = () => st.est;
  const UNITS = ['Stunden', 'Tage', 'Wochen', 'Story Points'];
  const HOURS = { Stunden: 1, Tage: 8, Wochen: 40 };
  const STATUS = { draft: { n: 'Entwurf', c: '#8e9cc7' }, agreed: { n: 'Abgestimmt', c: '#ffb340' }, offered: { n: 'Angeboten', c: '#6c7bff' }, ordered: { n: 'Beauftragt', c: '#4cf0a0' }, rejected: { n: 'Abgelehnt', c: '#ff5d73' } };
  const PRIO = { must: 'Must', should: 'Should', could: 'Could', wont: 'Won’t' };
  function newEstimate(o) {
    return Object.assign({ id: uid(), pid: '', title: 'Neue Schätzung', status: 'draft', date: today(), source: '', unit: 'Tage', idea: '', stories: [], tasks: [], extras: EXTRAS(), tpl: false, created: Date.now(), updated: Date.now() }, o || {});
  }
  const cur = () => E().estimates.find(x => x.id === E().cur);
  const projName = pid => { const p = E().projects.find(x => x.id === pid); return p ? p.name : 'Ohne Projekt'; };
  const conv = (v, from, to) => (from === to || !HOURS[from] || !HOURS[to]) ? n(v) : Math.round(n(v) * HOURS[from] / HOURS[to] * 100) / 100;
  const storyText = s => 'Als ' + (s.role || '…') + ' möchte ich ' + (s.want || '…') + (s.benefit ? ', damit ' + s.benefit : '') + '.';
  const storyNo = (es, sid) => { const i = es.stories.findIndex(s => s.id === sid); return i < 0 ? '' : 'US' + (i + 1); };

  // PERT je Aufgabe: Erwartungswert (O + 4M + P) / 6, Varianz ((P − O) / 6)²
  const tE = t => (n(t.o) + 4 * n(t.m) + n(t.p)) / 6;
  const tV = t => Math.pow((n(t.p) - n(t.o)) / 6, 2);
  function calc(es) {
    const base = es.tasks.reduce((a, t) => a + tE(t), 0), varc = es.tasks.reduce((a, t) => a + tV(t), 0);
    const ex = es.extras.filter(x => x.on).map(x => ({ x, amt: x.type === 'pct' ? base * n(x.v) / 100 : n(x.v) }));
    const pct = es.extras.filter(x => x.on && x.type === 'pct').reduce((a, x) => a + n(x.v), 0) / 100;
    const total = base + ex.reduce((a, e) => a + e.amt, 0), sd = Math.sqrt(varc) * (1 + pct);
    const bad = es.tasks.filter(t => !(n(t.o) <= n(t.m) && n(t.m) <= n(t.p)));
    return { base, sdBase: Math.sqrt(varc), ex, total, sd, p85: total + 1.04 * sd, r68: [Math.max(0, total - sd), total + sd], r95: [Math.max(0, total - 2 * sd), total + 2 * sd], bad };
  }

  function estView() {
    const v = E().view;
    if (v === 'edit' && cur()) return editView();
    if (v === 'lib') return libView();
    E().view = 'list'; listView();
  }
  function go(view, id) { E().view = view; if (id !== undefined) E().cur = id; persist(); sc.scrollTop = 0; view === 'edit' ? editView() : view === 'lib' ? libView() : listView(); }

  // ---------- Übersicht ----------
  function listView() {
    sc.className = 'scroll';
    const q = (E().q || '').toLowerCase();
    const match = es => !q || [es.title, es.source, es.idea, projName(es.pid), ...es.tasks.map(t => t.n + ' ' + t.d), ...es.stories.map(storyText)].join(' ').toLowerCase().includes(q);
    const list = E().estimates.filter(match).sort((a, b) => b.updated - a.updated);
    const groups = {};
    list.forEach(es => (groups[es.pid] = groups[es.pid] || []).push(es));
    const order = E().projects.map(p => p.id).filter(id => groups[id]).concat(groups[''] ? [''] : []).concat(Object.keys(groups).filter(id => id && !E().projects.some(p => p.id === id)));
    let h = '<div class="panel wide"><div class="bar"><button class="sm go" id="newE">＋ Neue Schätzung</button><button class="sm" id="lib">📚 Bibliothek</button><button class="sm" id="projs">🗂 Projekte</button></div>' +
      '<input id="q" placeholder="🔎 Schätzungen, Aufgaben, Stories durchsuchen …" value="' + esc(E().q) + '"></div>';
    if (!E().estimates.length) h += '<div class="panel wide"><div class="empty"><div class="e">🧮</div>Noch keine Schätzung gespeichert.<br>Lege eine an: erst die Lösungsidee, dann Anforderungen und Aufgaben, dazu allgemeine Aufwände. Alles wird automatisch gespeichert und lässt sich exportieren.</div></div>';
    else if (!list.length) h += '<div class="panel wide"><div class="empty">Nichts gefunden.</div></div>';
    order.forEach(pid => {

  // Ähnliche Aufgaben aus Bibliothek und früheren Schätzungen finden
  function known() {
    const es = cur(), L = E().lib.tasks.map(t => ({ t, unit: t.unit, from: 'Bibliothek' }));
    E().estimates.forEach(x => { if (x.id !== es.id) x.tasks.forEach(t => { if (t.n) L.push({ t, unit: x.unit, from: x.title }); }); });
    return L;
  }
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9äöüß ]/g, ' ').replace(/\s+/g, ' ').trim();
  function bestMatch(name) {
    const q = norm(name); if (q.length < 3) return null;
    const words = q.split(' ').filter(w => w.length > 2);
    let best = null, bs = 0;
    known().forEach(k => {
      const kn = norm(k.t.n); if (!kn || kn === q && k.from === 'Bibliothek' && false) return;
      let s = kn.includes(q) ? 3 : 0; words.forEach(w => { if (kn.includes(w)) s += 1; });
      if (k.from === 'Bibliothek') s += .5;
      if (s > bs) { bs = s; best = k; }
    });
    return bs >= 2 ? best : null;
  }
  let sugT;
  function suggest(box, t) {
    clearTimeout(sugT);
    sugT = setTimeout(() => {
      const host = box.querySelector('[data-sug]'), es = cur(), k = bestMatch(t.n);
      if (!k || (n(t.o) || n(t.m) || n(t.p)) && n(t.m) === conv(k.t.m, k.unit, es.unit)) { host.innerHTML = ''; return; }
      const v = [k.t.o, k.t.m, k.t.p].map(x => f1(conv(x, k.unit, es.unit))).join(' / ');
      host.innerHTML = '<div class="sug"><span>💡 Früher: <b>' + esc(k.t.n) + '</b> · ' + v + ' ' + esc(short(es.unit)) + '<br><small style="color:var(--mut)">aus ' + esc(k.from) + '</small></span><button>Übernehmen</button></div>';
      host.querySelector('button').onclick = () => {
        t.o = conv(k.t.o, k.unit, es.unit); t.m = conv(k.t.m, k.unit, es.unit); t.p = conv(k.t.p, k.unit, es.unit); if (!t.d && k.t.d) t.d = k.t.d;
        touch(es); renderTasks(); renderStories(); renderOut(); toast('Werte übernommen');
      };
    }, 300);
  }

  function reportText(es) {

    if (es.idea) L.push('Lösungsidee:', es.idea, '');
    if (es.stories.length) { L.push('Anforderungen:'); es.stories.forEach((s, i) => { L.push('US' + (i + 1) + ' [' + PRIO[s.prio || 'must'] + '] ' + storyText(s)); (s.ac || []).forEach(a => L.push('   ✔ ' + a)); }); L.push(''); }
    L.push('Aufgaben (O / M / P → erwartet, in ' + u + '):');

    L.push('Summe Aufgaben: ' + f1(r.base) + ' ' + u);

    L.push('', 'Methode: Dreipunktschätzung (PERT), Erwartungswert = (O + 4·M + P) / 6.');

  async function copyRich(html, text) {
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
        return toast('📋 Kopiert – in Outlook oder Teams einfach einfügen');
      }
    } catch (e) {}
    // Rückfallebene: formatierten Inhalt markieren und kopieren
    const d = document.createElement('div'); d.contentEditable = 'true'; d.innerHTML = html; Object.assign(d.style, { position: 'fixed', left: '-9999px', top: '0', background: '#fff' }); document.body.appendChild(d);
    const rg = document.createRange(); rg.selectNodeContents(d); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} sel.removeAllRanges(); d.remove();
    if (ok) return toast('📋 Kopiert – in Outlook oder Teams einfach einfügen');
    try { await navigator.clipboard.writeText(text); toast('📋 Als Text kopiert'); } catch (e) { toast('Kopieren nicht möglich'); }
  }

    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(A);
    ws['!cols'] = [{ wch: 5 }, { wch: 34 }, { wch: 50 }, { wch: 7 }, { wch: 12 }, { wch: 14 }, { wch: 13 }, { wch: 10 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Aufgaben');
    if (es.stories.length) {
      const S = [['Nr.', 'Rolle', 'Ziel', 'Nutzen', 'User Story', 'Akzeptanzkriterien', 'Priorität', 'Aufgaben', 'Erwartet (' + u + ')']];

        if (!chosen.length) return toast('Nichts ausgewählt');
        const map = {}; let ns = 0, nt = 0;
        chosen.filter(it => it.kind === 's').forEach(it => { const c = { id: uid(), role: it.s.role, want: it.s.want, benefit: it.s.benefit, ac: (it.s.ac || []).slice(), prio: it.s.prio || 'must' }; if (it.s.id) map[it.s.id] = c.id; es.stories.push(c); ns++; });
        chosen.filter(it => it.kind === 't').forEach(it => { es.tasks.push({ id: uid(), n: it.t.n, d: it.t.d || '', sid: mode === 'old' ? (map[it.t.sid] || '') : '', o: conv(it.t.o, it.unit, es.unit), m: conv(it.t.m, it.unit, es.unit), p: conv(it.t.p, it.unit, es.unit) }); nt++; });
        E().lib.tasks.forEach(t => { if (chosen.some(it => it.t === t)) t.used = (t.used || 0) + 1; });
        touch(es); closeSheet(); editView(); toast('Übernommen: ' + nt + ' Aufgaben, ' + ns + ' Stories');
      };
      draw();
    });
  }

  // ================= Kapazität =================
  function capView() {
    const C = st.cap;
    sc.innerHTML = '<div class="panel"><div class="lbl">Sprint</div><div class="row"><div class="f"><span>Arbeitstage</span><input inputmode="decimal" id="cd" value="' + C.days + '"></div><div class="f"><span>Fokusfaktor %</span><input inputmode="decimal" id="cf" value="' + C.focus + '"></div></div>' +
      '<div class="help">Der Fokusfaktor sagt, welcher Anteil der Zeit in echte Arbeit am Backlog fließt. Der Rest geht für Meetings, Support und Abstimmungen drauf. Üblich sind 60 bis 80 %.</div></div>' +
      '<div class="panel"><div class="lbl">Team</div><div id="mem"></div><button class="add" id="addM">+ Person</button></div>' +
      '<div class="panel"><div class="lbl">Kalibrierung (optional)</div><div class="help">Wie viele Story Points hat das Team beim letzten Sprint geschafft und mit wie vielen Personentagen? Daraus entsteht eine Prognose in Story Points.</div><div class="row"><div class="f"><span>Velocity letzter Sprint</span><input inputmode="decimal" id="rv" value="' + C.refVel + '" placeholder="z. B. 24"></div><div class="f"><span>Personentage (netto)</span><input inputmode="decimal" id="rp" value="' + C.refPt + '" placeholder="z. B. 32"></div></div></div>' +
      '<div class="panel"><div class="lbl">Ergebnis</div><div class="res" id="out"></div><div id="nt"></div></div>';
    ['cd', 'cf', 'rv', 'rp'].forEach(id => $(id).oninput = () => { C.days = $('cd').value; C.focus = $('cf').value; C.refVel = $('rv').value; C.refPt = $('rp').value; persist(); capCalc(); });
    $('addM').onclick = () => { C.members.push({ n: 'Person ' + (C.members.length + 1), av: 100, off: 0 }); persist(); capMem(); capCalc(); };
    capMem(); capCalc();
  }
  function capMem() {
    const C = st.cap, host = $('mem'); host.innerHTML = '';
    C.members.forEach((m, i) => {
      const d = document.createElement('div'); d.className = 'row';
      d.innerHTML = '<div class="f" style="flex:1.6"><span>Name</span><input value="' + esc(m.n) + '" data-k="n"></div><div class="f"><span>Verfügb. %</span><input inputmode="decimal" value="' + m.av + '" data-k="av"></div><div class="f"><span>Abwesend (T)</span><input inputmode="decimal" value="' + m.off + '" data-k="off"></div><button class="x">✕</button>';
      d.querySelectorAll('input').forEach(inp => inp.oninput = () => { m[inp.dataset.k] = inp.value; persist(); capCalc(); });
      d.querySelector('.x').onclick = () => { C.members.splice(i, 1); persist(); capMem(); capCalc(); };
      host.appendChild(d);
    });
  }
  function capCalc() {
    const C = st.cap, days = n(C.days), focus = n(C.focus) / 100;
    const gross = C.members.length * days;
    const net = C.members.reduce((a, m) => a + Math.max(0, days * n(m.av) / 100 - n(m.off)), 0);
    const eff = net * focus, rv = n(C.refVel), rp = n(C.refPt);
    let html = '<div class="r"><b>' + f1(gross) + '</b><span>Personentage brutto</span></div><div class="r"><b>' + f1(net) + '</b><span>netto (Urlaub, Teilzeit)</span></div><div class="r hl w"><b>' + f1(eff) + ' PT</b><span>Fokus-Kapazität</span></div>';
    let note = '<div class="note">Wenn alle Abwesenheiten eingerechnet sind, stehen dem Team ca. <b>' + f1(eff) + ' Personentage</b> für das Backlog zur Verfügung (' + f0(net ? eff / net * 100 : 0) + ' % der Nettozeit).</div>';
    if (rv > 0 && rp > 0) {
      const sp = eff * rv / rp;
      html += '<div class="r hl w"><b>' + f0(sp) + ' Story Points</b><span>Prognose für den Sprint</span></div><div class="r"><b>' + f1(rv / rp) + '</b><span>SP je Personentag</span></div><div class="r"><b>' + f0(sp * 0.85) + ' – ' + f0(sp * 1.1) + '</b><span>realistische Spanne</span></div>';
      note = '<div class="note good">✅ Bei gleichem Tempo wie zuletzt: Plane etwa <b>' + f0(sp * 0.9) + '</b> Story Points fest ein. Alles darüber ist Wunschdenken.</div>';
    }
    $('out').innerHTML = html; $('nt').innerHTML = note;
  }

  // ================= Prognose =================
  function fcView() {
    const F = st.fc;
    sc.innerHTML = '<div class="panel"><div class="lbl">Backlog &amp; Takt</div><div class="row"><div class="f"><span>Offene Story Points</span><input inputmode="decimal" id="fb" value="' + F.backlog + '"></div><div class="f"><span>Sprintlänge (Wochen)</span><input inputmode="decimal" id="fw" value="' + F.weeks + '"></div></div>' +
      '<div class="row"><div class="f"><span>Start</span><input type="date" id="fs" value="' + F.start + '"></div><div class="f"><span>Scope-Wachstum % / Sprint</span><input inputmode="decimal" id="fg" value="' + F.growth + '"></div></div></div>' +
      '<div class="panel"><div class="lbl">Velocity der letzten Sprints</div><div class="help">Trage die geschafften Story Points pro Sprint ein. Mehr Sprints bedeuten eine belastbarere Prognose.</div><div id="vl"></div><button class="add" id="addV">+ Sprint</button></div>' +
      '<div class="panel"><div class="lbl">Prognose</div><div class="res" id="out"></div><div id="ch" style="margin-top:10px"></div><div id="nt"></div></div>';
    ['fb', 'fw', 'fs', 'fg'].forEach(id => $(id).oninput = () => { F.backlog = $('fb').value; F.weeks = $('fw').value; F.start = $('fs').value; F.growth = $('fg').value; persist(); fcCalc(); });
    $('addV').onclick = () => { F.velos.push(F.velos.length ? F.velos[F.velos.length - 1] : 20); persist(); fcVel(); fcCalc(); };
    fcVel(); fcCalc();
  }
  function fcVel() {
    const F = st.fc, host = $('vl'); host.innerHTML = '';
    F.velos.forEach((v, i) => {
      const d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<div class="f"><span>Sprint ' + (i + 1) + '</span><input inputmode="decimal" value="' + v + '"></div><button class="x">✕</button>';
      d.querySelector('input').oninput = e => { F.velos[i] = e.target.value; persist(); fcCalc(); };
      d.querySelector('.x').onclick = () => { F.velos.splice(i, 1); persist(); fcVel(); fcCalc(); };
      host.appendChild(d);
    });
  }
  function sprintsNeeded(backlog, vel, growth) {
    if (vel <= 0) return Infinity;
    const add = backlog * growth / 100;
    if (add >= vel) return Infinity;
    let rest = backlog, k = 0;
    while (rest > 0 && k < 200) { rest = rest - vel + add; k++; }
    return k >= 200 ? Infinity : k;
  }
  function fcCalc() {
    const F = st.fc, vs = F.velos.map(n).filter(x => x > 0), back = n(F.backlog), weeks = Math.max(0.5, n(F.weeks)), g = n(F.growth);
    if (!vs.length || back <= 0) { $('out').innerHTML = ''; $('ch').innerHTML = ''; $('nt').innerHTML = '<div class="note warn">Trage Backlog und mindestens eine Velocity ein.</div>'; return; }
    const avg = vs.reduce((a, b) => a + b, 0) / vs.length, mn = Math.min(...vs), mx = Math.max(...vs);
    const start = F.start ? new Date(F.start + 'T12:00:00') : new Date();
    const sc = { w: sprintsNeeded(back, mn, g), a: sprintsNeeded(back, avg, g), b: sprintsNeeded(back, mx, g) };
    const date = k => isFinite(k) ? fd(new Date(start.getTime() + k * weeks * 7 * 86400000)) : 'nie';
    const lbl = k => isFinite(k) ? k + ' Sprints' : '∞';
    $('out').innerHTML = '<div class="r hl w"><b>' + date(sc.a) + '</b><span>Wahrscheinlich (Ø ' + f1(avg) + ' SP): ' + lbl(sc.a) + '</span></div>' +
      '<div class="r"><b>' + date(sc.b) + '</b><span>Optimistisch (' + f0(mx) + ' SP)</span></div><div class="r"><b>' + date(sc.w) + '</b><span>Pessimistisch (' + f0(mn) + ' SP)</span></div>';
    // Burndown-Diagramm
    const maxK = Math.min(60, Math.max(isFinite(sc.w) ? sc.w : 0, isFinite(sc.a) ? sc.a : 0, 4) + 1);
    const W = 340, H = 170, pl = 34, pb = 22, pt = 10, pr = 8, iw = W - pl - pr, ih = H - pt - pb;
    const line = (vel, col, dash) => { let rest = back, pts = [[0, back]]; const add = back * g / 100; for (let k = 1; k <= maxK; k++) { rest = Math.max(0, rest - vel + add); pts.push([k, rest]); if (rest <= 0) break; } return '<polyline fill="none" stroke="' + col + '" stroke-width="2.5" ' + (dash ? 'stroke-dasharray="6 4"' : '') + ' points="' + pts.map(p => (pl + p[0] / maxK * iw).toFixed(1) + ',' + (pt + ih - p[1] / back * ih).toFixed(1)).join(' ') + '"/>'; };
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '"><rect x="' + pl + '" y="' + pt + '" width="' + iw + '" height="' + ih + '" fill="none" stroke="#2e3d66"/>';
    for (let i = 0; i <= 4; i++) { const y = pt + ih - i / 4 * ih; svg += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#2e3d66" stroke-dasharray="3 4"/><text x="' + (pl - 4) + '" y="' + (y + 3) + '" text-anchor="end" fill="#8e9cc7" font-size="9">' + f0(back * i / 4) + '</text>'; }
    const step = Math.max(1, Math.ceil(maxK / 8));
    for (let k = 0; k <= maxK; k += step) svg += '<text x="' + (pl + k / maxK * iw) + '" y="' + (H - 6) + '" text-anchor="middle" fill="#8e9cc7" font-size="9">S' + k + '</text>';
    svg += line(mx, '#4cf0a0', true) + line(avg, '#7b8cff', false) + line(mn, '#ff5d73', true) + '</svg><div style="display:flex;gap:12px;justify-content:center;font-size:11px;font-weight:800;color:var(--mut);margin-top:4px"><span style="color:#4cf0a0">● optimistisch</span><span style="color:#7b8cff">● wahrscheinlich</span><span style="color:#ff5d73">● pessimistisch</span></div>';
    $('ch').innerHTML = svg;
    const spread = (mx - mn) / avg;
    $('nt').innerHTML = '<div class="note ' + (spread > 0.5 ? 'warn' : '') + '">' + (g > 0 && !isFinite(sc.w) ? '⚠️ Mit diesem Scope-Wachstum holt ihr das Backlog im pessimistischen Fall nie ein. ' : '') +
      (spread > 0.5 ? '📉 Die Velocity schwankt stark (' + f0(mn) + ' bis ' + f0(mx) + '). Kommuniziere lieber die Spanne ' + date(sc.b) + ' bis ' + date(sc.w) + ' statt eines einzelnen Termins.' : '📈 Die Velocity ist stabil. Der Termin ' + date(sc.a) + ' ist ein solides Planziel, die Spanne reicht von ' + date(sc.b) + ' bis ' + date(sc.w) + '.') + '</div>';
  }

  // ================= Risiken =================
  const rcol = s => s >= 15 ? '#ff5d73' : s >= 8 ? '#ffb340' : s >= 4 ? '#ffe066' : '#4cf0a0';
  function riskView() {
    sc.innerHTML = '<div class="panel"><div class="lbl">Risiko-Matrix</div><div id="hm"></div></div><div class="panel"><div class="lbl">Neues Risiko</div><div class="row"><div class="f"><span>Beschreibung</span><input id="rn" placeholder="Was kann schiefgehen?" maxlength="60"></div></div>' +
      '<div class="row"><div class="f"><span>Wahrscheinlichkeit (1–5)</span><div class="seg" id="sw"></div></div></div><div class="row"><div class="f"><span>Auswirkung (1–5)</span><div class="seg" id="sa"></div></div></div><button class="add" id="ar" style="margin-top:4px">+ Risiko hinzufügen</button></div>' +
      '<div class="panel"><div class="lbl">Rangliste (Score = W × A)</div><div id="rl"></div></div>';
    let w = 3, a = 3;
    const seg = (host, get, set) => { const el = $(host); el.innerHTML = [1, 2, 3, 4, 5].map(i => '<button data-i="' + i + '" class="' + (get() === i ? 'on' : '') + '">' + i + '</button>').join(''); el.querySelectorAll('button').forEach(b => b.onclick = () => { set(+b.dataset.i); seg(host, get, set); }); };
    seg('sw', () => w, v => w = v); seg('sa', () => a, v => a = v);
    $('ar').onclick = () => { const t = $('rn').value.trim(); if (!t) { $('rn').focus(); return; } st.risk.list.push({ n: t, w, a }); persist(); riskView(); };
    riskDraw();
  }
  function riskDraw() {
    const L = st.risk.list;
    let h = '<div class="heat">';
    for (let w = 5; w >= 1; w--) { h += '<div class="ax">' + w + '</div>'; for (let a = 1; a <= 5; a++) { const cnt = L.filter(r => r.w === w && r.a === a).length, s = w * a; h += '<div class="c" style="background:' + rcol(s) + (cnt ? '' : '55') + ';color:#101424">' + (cnt || '') + '</div>'; } }
    h += '<div></div>' + [1, 2, 3, 4, 5].map(a => '<div class="ax">' + a + '</div>').join('') + '</div><div style="text-align:center;font-size:10px;font-weight:800;color:var(--mut);margin-top:4px">AUSWIRKUNG →  (links: Wahrscheinlichkeit ↑)</div>';
    $('hm').innerHTML = h;
    const rl = $('rl');
    if (!L.length) { rl.innerHTML = '<div class="help">Noch keine Risiken erfasst.</div>'; return; }
    rl.innerHTML = '';
    L.map((r, i) => ({ r, i, s: r.w * r.a })).sort((x, y) => y.s - x.s).forEach(({ r, i, s }) => {
      const d = document.createElement('div'); d.className = 'rk';
      d.innerHTML = '<span class="sc" style="background:' + rcol(s) + '">' + s + '</span><b>' + esc(r.n) + '</b><small>W' + r.w + ' · A' + r.a + '</small><button class="x" style="flex-basis:30px;height:30px">✕</button>';
      d.querySelector('.x').onclick = () => { L.splice(i, 1); persist(); riskDraw(); };
      rl.appendChild(d);
    });
    const crit = L.filter(r => r.w * r.a >= 15).length;
    rl.insertAdjacentHTML('beforeend', '<div class="note ' + (crit ? 'bad' : 'good') + '">' + (crit ? '🚨 ' + crit + ' kritische(s) Risiko (Score ≥ 15). Plane Gegenmaßnahmen, Verantwortliche und einen Notfallplan.' : '✅ Keine kritischen Risiken. Beobachte trotzdem die Einträge über 8.') + '</div>');
  }

  $('reset').onclick = () => { if (st.tab === 'est') return; if (confirm('Alle Eingaben dieses Tabs zurücksetzen?')) { const d = DEF(); st[st.tab] = d[st.tab]; persist(); view(); } };
  document.addEventListener('gesturestart', e => e.preventDefault());
  migrate(); tabs(); view();
  $('syncb').onclick = () => AppSync.open();
  AppSync.init({ name: 'pm-rechner', label: 'PM-Rechner',
    // Ansichtszustand (offene Schätzung, Suche) bleibt pro Gerät
    getData: () => { const c = JSON.parse(JSON.stringify(st)); delete c.tab; delete c.est.view; delete c.est.cur; delete c.est.q; return c; },
    setData: d => { const tab = st.tab, ui = { view: st.est.view, cur: st.est.cur, q: st.est.q }; st = Object.assign(DEF(), d, { tab }); migrate(); Object.assign(st.est, ui); persist.quiet = true; persist(); persist.quiet = false; view(); },
    hasData: () => localStorage.getItem(KEY) !== null });
  window.__PM = { get st() { return st; }, calc, reportText, reportHTML, bestMatch, sprintsNeeded };
})();
</script>
</body>
