<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aether Deck">
<meta name="theme-color" content="#070a1a">
<title>Aether Deck</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  :root { --bg: #070a1a; --pan: rgba(18,24,52,.86); --line: #2b3770; --txt: #eef2ff; --mut: #8f9bc9; --atk: #ff6a4d; --skl: #4da6ff; --pow: #c47cff;
    --gold: #ffd25a; --hp: #ff4d6d; --good: #4cf0a0; --acc: #8f7bff; --z1: #3ee0d0; --z2: #7dff8a; --z3: #ff5d7a; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; height: 100dvh; color: var(--txt); background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  button { font-family: inherit; color: inherit; border: 0; cursor: pointer; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bg { position: absolute; inset: 0; transition: background 1s; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
  .scr { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: fi .25s; }
  @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; min-height: 0; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(90deg, #7ef0ff, #b48cff, #ff8ad8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: 20px; font-weight: 900; }
  .mut { color: var(--mut); }
  .btn { padding: 13px 18px; border-radius: 14px; font-size: 16px; font-weight: 900; background: linear-gradient(135deg, #5b6cff, #9a6bff); box-shadow: 0 6px 22px rgba(124,110,255,.4); }
  .btn.sec { background: rgba(255,255,255,.08); box-shadow: none; border: 1px solid var(--line); }
  .btn[disabled] { opacity: .4; }
  .btn:active { transform: scale(.97); }
  .back { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,.08); display: grid; place-items: center; text-decoration: none; color: var(--txt); font-size: 20px; z-index: 3; }

  /* Menü */
  .menu { align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .heroes { display: flex; gap: 10px; width: 100%; max-width: 380px; }
  .hero { flex: 1; background: var(--pan); border: 1px solid var(--line); border-radius: 18px; padding: 14px 8px; text-align: center; }
  .hero .av { font-size: 54px; filter: drop-shadow(0 0 14px var(--c)); }
  .hero b { display: block; font-size: 16px; margin-top: 4px; }
  .hero span { display: block; font-size: 11px; color: var(--mut); margin-top: 4px; line-height: 1.35; }
  .hero:active { transform: scale(.97); border-color: var(--c); }

  /* Top-Bar */
  .top { display: flex; align-items: center; gap: 6px; padding: 2px 0 6px; font-size: 13px; font-weight: 800; flex-wrap: nowrap; }
  .top .pill { background: var(--pan); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; white-space: nowrap; }
  .top .sp { flex: 1; }
  .top button.pill { font-size: 13px; }
  .relics { display: flex; gap: 2px; font-size: 16px; flex-wrap: wrap; }

  /* Karte */
  .card { position: relative; flex: 0 0 auto; width: var(--cw, 76px); height: calc(var(--cw, 76px) * 1.42); border-radius: 10px; padding: 4px 4px 3px;
    background: linear-gradient(180deg, #1c2550, #121838); border: 2px solid var(--rc, #6b76a8); text-align: center; display: flex; flex-direction: column;
    box-shadow: 0 4px 14px rgba(0,0,0,.5); transition: transform .15s, box-shadow .15s; overflow: hidden; }
  .card.atk { background: linear-gradient(180deg, #4a2230, #2a1220); } .card.skl { background: linear-gradient(180deg, #1b3558, #10203a); } .card.pow { background: linear-gradient(180deg, #3d2358, #22123a); }
  .card.curse { background: linear-gradient(180deg, #2a2a2a, #111); }
  .card.r-c { --rc: #8b94bd; } .card.r-u { --rc: #4de0c8; } .card.r-r { --rc: #ffd25a; box-shadow: 0 0 12px rgba(255,210,90,.35), 0 4px 14px rgba(0,0,0,.5); }
  .card .cost { position: absolute; left: -2px; top: -2px; width: calc(var(--cw, 76px) * .28); height: calc(var(--cw, 76px) * .28); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7ef0ff, #2a74ff);
    border: 2px solid #fff; font-weight: 900; font-size: calc(var(--cw, 76px) * .17); display: grid; place-items: center; z-index: 2; }
  .card .cn { font-size: calc(var(--cw, 76px) * .125); font-weight: 900; line-height: 1.1; margin: 1px 0 0 calc(var(--cw, 76px) * .22); min-height: calc(var(--cw, 76px) * .28); display: flex; align-items: center; justify-content: center; }
  .card .art { font-size: calc(var(--cw, 76px) * .36); line-height: 1.1; margin: 1px 0; }
  .card .ct { font-size: calc(var(--cw, 76px) * .105); line-height: 1.18; color: #dbe3ff; flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 1px; }
  .card.up .cn { color: #7dff9a; }
  .card.no { filter: grayscale(.85) brightness(.6); }
  .card.big { --cw: 104px; }
  .card.sel { transform: translateY(-26px) scale(1.12); z-index: 20 !important; box-shadow: 0 0 22px rgba(160,200,255,.9); }
  .tagrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* Karte-Ansicht */
  .grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 0; }
  .grid .card { --cw: 82px; }
  .grid .card:active { transform: scale(.96); }

  /* Karte/Map */
  #map { position: relative; margin: 0 auto; width: 100%; max-width: 380px; }
  #map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .nd { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--pan); border: 2px solid var(--line); font-size: 25px;
    display: grid; place-items: center; opacity: .5; }
  .nd.reach { opacity: 1; border-color: #fff; box-shadow: 0 0 18px rgba(255,255,255,.7); animation: pl 1.2s infinite; }
  .nd.done { opacity: .35; border-color: var(--good); }
  .nd.cur { opacity: 1; border-color: var(--gold); box-shadow: 0 0 14px var(--gold); }
  @keyframes pl { 50% { transform: scale(1.1); } }

  /* Kampf */
  .arena { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .foes { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 0 6px; min-height: 0; }
  .foe { flex: 1; max-width: 140px; text-align: center; position: relative; transition: transform .2s; }
  .foe .intent { font-size: 13px; font-weight: 900; min-height: 20px; display: flex; gap: 3px; justify-content: center; align-items: center; white-space: nowrap; }
  .foe .spr { font-size: 78px; line-height: 1.1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); animation: bob 3s ease-in-out infinite; }
  .foe.boss .spr { font-size: 118px; }
  .foe .nm { font-size: 11px; font-weight: 800; color: var(--mut); }
  .hpbar { height: 9px; border-radius: 5px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); position: relative; overflow: hidden; margin: 3px 4px 0; }
  .hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #ff4d6d, #ff8a5c); transition: width .3s; }
  .hpbar b { position: absolute; inset: 0; font-size: 8px; line-height: 7px; text-align: center; font-weight: 900; text-shadow: 0 0 3px #000; }
  .blk { color: #7ec8ff; font-weight: 900; }
  .sts { display: flex; gap: 4px; justify-content: center; font-size: 10px; font-weight: 900; min-height: 14px; margin-top: 2px; flex-wrap: wrap; }
  .foe.tgt .spr { filter: drop-shadow(0 0 14px #ff5d5d); }
  .foe.tgt::after { content: '🎯'; position: absolute; top: 0; right: 4px; font-size: 20px; animation: pl .6s infinite; }
  .foe.hit { animation: hit .3s; } @keyframes hit { 30% { transform: translateX(8px) scale(.94); } 60% { transform: translateX(-6px); } }
  .foe.act { transform: translateY(14px) scale(1.12); }
  .foe.dead { opacity: 0; transform: scale(.5) rotate(20deg); transition: all .4s; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .me { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  .me .av { font-size: 46px; filter: drop-shadow(0 0 10px var(--c)); }
  .me .bars { flex: 1; }
  .me .hpbar { height: 14px; margin: 0; } .me .hpbar b { font-size: 10px; line-height: 12px; }
  .me .sts { justify-content: flex-start; }
  .me.hit { animation: hit .3s; }
  .orb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 900; background: radial-gradient(circle at 35% 30%, #9ff3ff, #2a74ff 70%); border: 3px solid #fff; box-shadow: 0 0 16px #4da6ff; flex: 0 0 auto; }
  .orb small { font-size: 10px; display: block; }
  .shield { font-size: 13px; font-weight: 900; color: #7ec8ff; }
  #hand { position: relative; height: calc(var(--cw, 76px) * 1.42 + 34px); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
  #hand .card { transition: transform .15s; }
  #hand .card .cn { font-size: calc(var(--cw) * .12); }
  .ctl { display: flex; align-items: center; gap: 8px; padding-top: 4px; }
  .pile { flex: 0 0 52px; height: 40px; border-radius: 10px; background: var(--pan); border: 1px solid var(--line); font-size: 12px; font-weight: 800; text-align: center; line-height: 1.15; padding-top: 3px; }
  .pile span { display: block; font-size: 15px; }
  .endb { flex: 1; padding: 12px; border-radius: 14px; font-size: 16px; font-weight: 900; background: linear-gradient(135deg, #ff7a4d, #ff4d8a); box-shadow: 0 4px 16px rgba(255,90,100,.4); }
  .endb[disabled] { opacity: .4; }
  #prev { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--cw, 76px) * 1.42 + 78px); background: rgba(10,14,34,.96); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px 12px; font-size: 14px; font-weight: 800; text-align: center; max-width: 92%; z-index: 30; pointer-events: none; display: none; }
  #prev.on { display: block; }
  #fxl { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .flt { position: absolute; font-size: 26px; font-weight: 900; text-shadow: 0 2px 6px #000, 0 0 12px currentColor; animation: fl 1s forwards; transform: translateX(-50%); }
  @keyframes fl { from { transform: translate(-50%, 0) scale(.6); opacity: 1; } 20% { transform: translate(-50%, -10px) scale(1.3); } to { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
  .banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; font-size: 30px; font-weight: 900; z-index: 35; pointer-events: none; text-shadow: 0 0 20px #000; animation: fl2 1.4s forwards; }
  @keyframes fl2 { 0% { opacity: 0; transform: scale(.7); } 20%, 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  .flash { position: absolute; inset: 0; background: #ff2d4d; opacity: 0; pointer-events: none; z-index: 38; }
  .flash.on { animation: fh .35s; } @keyframes fh { 30% { opacity: .35; } }

  /* Listen / Panels */
  .panel { background: var(--pan); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .opt { width: 100%; text-align: left; background: var(--pan); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .opt .ico { font-size: 28px; } .opt b { display: block; font-size: 15px; } .opt span { font-size: 12px; color: var(--mut); display: block; line-height: 1.35; margin-top: 2px; }
  .opt:active { border-color: var(--acc); transform: scale(.98); }
  .opt[disabled] { opacity: .45; }
  .shopc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .price { font-size: 13px; font-weight: 900; color: var(--gold); }
  .price.no { color: #ff6a6a; }
  .ov { position: absolute; inset: 0; z-index: 60; background: rgba(4,6,16,.88); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  .ov.on { display: flex; }
  .stat { display: inline-block; background: var(--pan); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 3px; font-size: 13px; font-weight: 800; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="bg"></div>
<div id="app"></div>
<div class="ov" id="ov"></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let FAST = false;
  const wait = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

  // ---------- Speicher ----------
  const KEY = 'aetherDeck.v1', RUNKEY = 'aetherDeck.run';
  const meta = { wins: 0, bestZone: 0, runs: 0, muted: false };
  try { Object.assign(meta, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const saveMeta = () => { try { localStorage.setItem(KEY, JSON.stringify(meta)); } catch (e) {} };

  // ---------- Audio ----------
  let AC = null;
  function tone(f1, f2, dur, type = 'sine', vol = 0.1, delay = 0) {
    if (meta.muted) return;
    try {
      if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; AC = new A(); }
      if (AC.state === 'suspended') AC.resume();
      const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t);
      if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    tap() { tone(600, 760, .05, 'triangle', .06); },
    atk() { tone(300, 80, .15, 'sawtooth', .1); },
    blk() { tone(500, 700, .12, 'square', .06); },
    hurt() { tone(160, 50, .3, 'sawtooth', .16); },
    buff() { [500, 700, 900].forEach((f, i) => tone(f, f, .1, 'triangle', .08, i * .06)); },
    gold() { tone(900, 1300, .08, 'square', .06); tone(1300, 1700, .1, 'square', .06, .07); },
    win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, .16, 'triangle', .12, i * .09)); },
    lose() { tone(300, 40, 1.2, 'sawtooth', .15); },
    kill() { tone(200, 60, .25, 'square', .1); }
  };

  // ---------- Sternenhimmel ----------
  const sc = $('stars'), sx = sc.getContext('2d'); let stars = [], SW = 0, SH = 0, zoneTheme = 0;
  function sResize() { const d = Math.min(devicePixelRatio || 1, 2); SW = innerWidth; SH = innerHeight; sc.width = SW * d; sc.height = SH * d; sx.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: 90 }, () => ({ x: Math.random() * SW, y: Math.random() * SH, z: Math.random() * 0.9 + 0.1, p: Math.random() * 6 })); }
  addEventListener('resize', sResize); sResize();
  const THEMES = [
    ['radial-gradient(ellipse at 50% 15%, #1d3a5e 0%, #0a1230 55%, #04060f 100%)', '#7ef0ff'],
    ['radial-gradient(ellipse at 50% 15%, #1c4a3a 0%, #0a2322 55%, #040b0b 100%)', '#9dffb0'],
    ['radial-gradient(ellipse at 50% 15%, #55203f 0%, #1c0c26 55%, #08040c 100%)', '#ff9ac0']
  ];
  function theme(z) { zoneTheme = z; $('bg').style.background = THEMES[z][0]; }
  theme(0);
  (function loop(t) {
    sx.clearRect(0, 0, SW, SH);
    for (const s of stars) {
      s.y += s.z * 0.18; if (s.y > SH) { s.y = 0; s.x = Math.random() * SW; }
      sx.globalAlpha = (0.35 + 0.5 * Math.sin(t / 700 + s.p) ** 2) * s.z; sx.fillStyle = THEMES[zoneTheme][1];
      sx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    }
    requestAnimationFrame(loop);
  })(0);

  // ---------- Karten ----------
  // c = Kosten, t = Typ (atk/skl/pow), tg = one|all|self, r = Seltenheit (s Start, c, u, r), u = Überschreibungen für die verbesserte Version
  const CARDS = {
    strike: { n: 'Schlag', c: 1, t: 'atk', ico: '⚔️', dmg: 6, u: { dmg: 9 }, r: 's' },
    defend: { n: 'Schild', c: 1, t: 'skl', ico: '🛡️', block: 5, u: { block: 8 }, r: 's' },
    plasma: { n: 'Plasmaschlag', c: 1, t: 'atk', ico: '🔥', dmg: 8, vuln: 1, u: { dmg: 11, vuln: 2 }, r: 's' },
    funke: { n: 'Äther-Funke', c: 1, t: 'atk', ico: '✨', dmg: 5, poison: 3, u: { dmg: 7, poison: 5 }, r: 's' },
    blick: { n: 'Sternenblick', c: 0, t: 'skl', ico: '👁️', draw: 1, block: 2, u: { draw: 2 }, r: 's' },
    // Nova-Ritter
    doppel: { n: 'Doppelhieb', c: 1, t: 'atk', ico: '⚔️', dmg: 4, hits: 2, u: { dmg: 6 }, r: 'c', h: 'A' },
    stoss: { n: 'Schildstoß', c: 1, t: 'atk', ico: '🛡️', dmgBlock: true, u: { block: 4 }, r: 'c', h: 'A' },
    hammer: { n: 'Vorschlaghammer', c: 2, t: 'atk', ico: '🔨', dmg: 14, vuln: 2, u: { dmg: 18, vuln: 3 }, r: 'c', h: 'A' },
    haut: { n: 'Eiserne Haut', c: 1, t: 'skl', ico: '🦾', block: 9, u: { block: 12 }, r: 'c', h: 'A' },
    kreis: { n: 'Kreisschnitt', c: 1, t: 'atk', ico: '🌀', dmg: 5, tg: 'all', u: { dmg: 8 }, r: 'c', h: 'A' },
    rausch: { n: 'Kampfrausch', c: 1, t: 'pow', ico: '💪', pw: { str: 2 }, u: { c: 0 }, r: 'u', h: 'A' },
    berserk: { n: 'Berserker', c: 0, t: 'skl', ico: '😤', draw: 2, lose: 2, u: { draw: 3 }, r: 'u', h: 'A' },
    bollwerk: { n: 'Bollwerk', c: 2, t: 'skl', ico: '🏰', block: 16, u: { block: 22 }, r: 'u', h: 'A' },
    novab: { n: 'Nova-Explosion', c: 2, t: 'atk', ico: '💥', dmg: 12, tg: 'all', u: { dmg: 16 }, r: 'u', h: 'A' },
    dornen: { n: 'Dornenpanzer', c: 1, t: 'pow', ico: '🌵', pw: { thorns: 3 }, u: { pw: { thorns: 5 } }, r: 'u', h: 'A' },
    plating: { n: 'Plasma-Rüstung', c: 1, t: 'pow', ico: '⚙️', pw: { plating: 3 }, u: { pw: { plating: 5 } }, r: 'r', h: 'A' },
    richt: { n: 'Hinrichtung', c: 3, t: 'atk', ico: '🗡️', dmg: 28, exhaust: true, u: { dmg: 38 }, r: 'r', h: 'A' },
    titan: { n: 'Titanform', c: 3, t: 'pow', ico: '🗿', pw: { str: 5 }, u: { c: 2 }, r: 'r', h: 'A' },
    // Äther-Magierin
    gift: { n: 'Giftpfeil', c: 1, t: 'atk', ico: '🏹', dmg: 4, poison: 5, u: { dmg: 5, poison: 7 }, r: 'c', h: 'B' },
    seuche: { n: 'Seuchenwolke', c: 2, t: 'skl', ico: '☁️', poison: 7, tg: 'all', u: { poison: 10 }, r: 'u', h: 'B' },
    surge: { n: 'Mana-Schub', c: 0, t: 'skl', ico: '🔋', energy: 2, exhaust: true, u: { draw: 1 }, r: 'u', h: 'B' },

    const eo = $('eo');
    ev.o.forEach(o => {
      const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = '<div><b>' + o.l + '</b><span>' + o.s + '</span></div>';
      b.onclick = () => {
        sfx.tap();
        if (o.act) { showCards('Welche Karte entfernen?', R.deck, (c, i) => { R.hp = Math.max(1, R.hp - 10); R.deck.splice(i, 1); finishNode(n); }); return; }
        const msg = o.fn();
        app.innerHTML = '<div class="scr">' + topBar() + '<div class="panel" style="margin-top:8px"><h2>' + ev.t + '</h2><p style="margin-top:8px;font-size:15px;line-height:1.45">' + msg + '</p></div><button class="btn" id="cont">Weiter</button></div>';
        wireTop(); $('cont').onclick = () => finishNode(n);
      };
      eo.appendChild(b);
    });
  }

  // ---------- Menü ----------
  function showMenu() {
    theme(0); const app = $('app'); app.style.removeProperty('--cw');
    const saved = loadRun();
    app.innerHTML = '<a class="back" href="index.html" aria-label="Zurück">←</a><div class="scr menu"><div style="font-size:60px;filter:drop-shadow(0 0 20px #8f7bff)">🌌</div><h1>Aether Deck</h1>' +
      '<div class="mut" style="font-size:13px;max-width:320px;line-height:1.45">Baue dein Deck, durchquere drei zerbrochene Welten und stürze den Nullkönig.</div>' +
      (saved ? '<button class="btn" id="resume" style="min-width:240px">▶ Run fortsetzen (Zone ' + (saved.zone + 1) + ' · ' + HEROES[saved.hero].av + ')</button>' : '') +
      '<div style="font-weight:800;margin-top:4px">' + (saved ? 'Oder neuer Run mit:' : 'Wähle deine Heldin / deinen Helden') + '</div>' +
      '<div class="heroes">' + Object.values(HEROES).map(H => '<button class="hero" data-h="' + H.id + '" style="--c:' + H.c + '"><div class="av">' + H.av + '</div><b>' + H.n + '</b><span>' + H.d + '</span><span>❤️ ' + H.hp + '</span></button>').join('') + '</div>' +
      '<div class="mut" style="font-size:12px;line-height:1.5">Tippe eine Karte an, dann einen Gegner (oder nochmal die Karte).<br>🏆 ' + meta.wins + ' Siege · ' + meta.runs + ' Runs</div></div>';
    document.querySelectorAll('.hero').forEach(b => b.onclick = () => { sfx.tap(); newRun(b.dataset.h); });
    const r = $('resume'); if (r) r.onclick = () => { R = saved; sfx.tap(); showMap(); };
  }

  addEventListener('resize', () => { if (C && !C.over) renderCombat(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  showMenu();

  window.__DK = { get R() { return R; }, get C() { return C; }, newRun, setFast: v => { FAST = v; }, playCard, endTurn, cardEff, enterNode, nodeById, reachable, reward: n => n, get busy() { return busy; }, showMap, mk, CARDS };
})();
</script>
</body>
