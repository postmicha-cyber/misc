<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Standup-Board">

<title>Standup-Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  :root { --bg: #0d1322; --card: #161f36; --card2: #1e2a47; --line: #2c3a63; --txt: #eef2ff; --mut: #8d9bc6; --acc: #7c8cff; --g: #3fe08f; --y: #ffc247; --r: #ff5d6c; }
  html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; height: 100dvh; color: var(--txt); background: radial-gradient(circle at 50% -10%, #1d2a55, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: manipulation; }
  button, input, select, textarea { font-family: inherit; color: inherit; border: 0; }
  button { cursor: pointer; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .top h1 { font-size: 21px; font-weight: 900; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ibtn { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; font-size: 18px; text-decoration: none; color: var(--txt); flex: 0 0 auto; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; min-height: 0; padding-bottom: 12px; }
  .nav { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; margin-top: 6px; }
  .nav button { flex: 1; padding: 8px 2px; border-radius: 12px; background: none; font-size: 11px; font-weight: 800; color: var(--mut); display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
  .nav button i { font-style: normal; font-size: 19px; }
  .nav button.on { background: var(--acc); color: #fff; }
  .nav .bd { position: absolute; top: 2px; right: 26%; background: var(--r); color: #fff; font-size: 10px; font-weight: 900; border-radius: 9px; padding: 1px 5px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .lbl { font-size: 11px; font-weight: 900; letter-spacing: 1.2px; color: var(--mut); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .lbl .sp { flex: 1; }
  .sec { font-size: 12px; font-weight: 900; letter-spacing: 1.2px; color: var(--mut); text-transform: uppercase; margin: 6px 2px 8px; display: flex; gap: 6px; align-items: center; }
  .sec .sp { flex: 1; } .sec button { background: none; color: var(--acc); font-size: 12px; font-weight: 800; }
  .help { font-size: 12px; color: var(--mut); line-height: 1.45; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 900; background: linear-gradient(135deg, #5b6cff, #9a6bff); box-shadow: 0 6px 20px rgba(108,123,255,.35); margin-top: 8px; }
  .btn.sec2 { background: var(--card2); box-shadow: none; border: 1px solid var(--line); }
  .btn.red { background: rgba(255,93,108,.14); color: var(--r); box-shadow: none; border: 1px solid var(--r); }
  .btn:active { transform: scale(.98); }
  .sm { padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; }
  .sm.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  input, select, textarea { width: 100%; padding: 11px 9px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 16px; min-width: 0; }
  textarea { resize: none; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--acc); }
  .f { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .f > span { font-size: 10px; font-weight: 800; letter-spacing: .8px; color: var(--mut); text-transform: uppercase; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { padding: 7px 11px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--mut); white-space: nowrap; }
  .chips button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .chips.hs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -14px 10px; padding: 0 14px; scrollbar-width: none; }
  .chips.hs::-webkit-scrollbar { display: none; }
  .sum { display: flex; gap: 8px; margin-bottom: 10px; }
  .sum div { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; }
  .sum b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; } .sum span { font-size: 10px; font-weight: 800; color: var(--mut); letter-spacing: .8px; text-transform: uppercase; }
  /* Projektkarten */
  .pc { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--sc, var(--line)); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .pc.g { --sc: var(--g); } .pc.y { --sc: var(--y); } .pc.r { --sc: var(--r); } .pc.dn { opacity: .55; }
  .pc .h { display: flex; align-items: center; gap: 8px; }
  .pc .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc .sub { font-size: 12px; color: var(--mut); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 8px; color: #0b1020; background: #9fb0ff; white-space: nowrap; }
  .tag.ph { background: var(--card2); color: var(--mut); border: 1px solid var(--line); }
  .pc .ak { font-size: 13px; margin-top: 8px; color: #d4dcff; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pc .ak small { color: var(--mut); font-weight: 800; margin-right: 4px; }
  .pc .ak.none { color: var(--mut); font-style: italic; }
  .fl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .fl span { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,.07); line-height: 1.3; }
  .fl .r { background: rgba(255,93,108,.16); color: #ff9aa4; } .fl .y { background: rgba(255,194,71,.14); color: #ffd27a; } .fl .n { color: var(--mut); }
  .bar { position: relative; height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 10px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--g); max-width: 100%; } .bar i.y { background: var(--y); } .bar i.r { background: var(--r); }
  .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; opacity: .75; border-radius: 1px; }
  .bt { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 800; color: var(--mut); margin-top: 5px; flex-wrap: wrap; }
  .pin { color: var(--y); }
  .ent { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.45; } .ent:last-child { border: 0; }
  .ent small { display: block; font-size: 11px; font-weight: 800; color: var(--mut); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; margin-bottom: 8px; }
  .kv div span { display: block; font-size: 10px; font-weight: 800; letter-spacing: .8px; color: var(--mut); text-transform: uppercase; }
  .kv div b { font-weight: 700; word-break: break-word; }
  .ov { position: absolute; inset: 0; z-index: 50; background: rgba(3,6,16,.78); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: none; align-items: flex-end; }
  .ov.on { display: flex; }
  .sheet { width: 100%; max-height: 92%; overflow-y: auto; background: #111a30; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); animation: up .25s; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { font-size: 18px; font-weight: 900; margin-bottom: 10px; }
  #toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: #000e; border: 1px solid var(--acc); border-radius: 12px; padding: 9px 14px; font-size: 13px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 70; max-width: 90%; text-align: center; }
  #toast.on { opacity: 1; }
  .empty { text-align: center; padding: 30px 10px; color: var(--mut); font-size: 14px; line-height: 1.5; } .empty .e { font-size: 50px; }
  .note { font-size: 13px; line-height: 1.45; padding: 10px; border-radius: 12px; background: rgba(124,140,255,.12); border: 1px solid var(--acc); margin-bottom: 10px; }
  .mp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .mp select { padding: 7px 6px; font-size: 13px; }
  #exit { display: none; position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 60; }
  body.pres #exit { display: grid; } body.pres .nav, body.pres .top .ibtn { display: none; } body.pres #sc { zoom: 1.2; }

  /* ---- Breite Bildschirme (iPad, Notebook) ---- */
  @media (min-width: 760px) {
    #app { max-width: 1320px; width: 100%; margin: 0 auto; padding-left: calc(24px + env(safe-area-inset-left)); padding-right: calc(24px + env(safe-area-inset-right)); }
    .top { margin-bottom: 14px; } .top h1 { font-size: 26px; } .ibtn { width: 44px; height: 44px; }
    #sc { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; align-content: start; align-items: start; padding-bottom: 18px; }
    #sc > * { margin: 0 !important; min-width: 0; }
    #sc > .sum, #sc > .note, #sc > .chips, #sc > .empty, #sc > .sec, #sc > .full { grid-column: 1 / -1; }
    .sum b { font-size: 28px; }
    .chips.hs { flex-wrap: wrap; overflow: visible; padding: 0; margin: 0 0 10px; }
    .nav { max-width: 520px; width: 100%; align-self: center; margin-top: 10px; }
    .ov { align-items: center; justify-content: center; }
    .sheet { max-width: 640px; border-radius: 22px; border: 1px solid var(--line); padding-bottom: 16px; }
    .btn { max-width: 520px; } #toast { bottom: 110px; }
  }
  @media (min-width: 1200px) { #sc { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); } }
</style>
</head>
<body>
<div id="app">
  <div class="top"><a class="ibtn" href="index.html" aria-label="Zurück">←</a><h1 id="ttl">📣 Standup</h1><button class="ibtn" id="cp" aria-label="Standup-Text kopieren">📋</button><button class="ibtn" id="pr" aria-label="Präsentieren">🖥️</button><button class="ibtn" id="im" aria-label="Projektliste importieren">📥</button></div>
  <div class="scroll" id="sc"></div>
  <div class="nav" id="nav">
    <button data-v="stand"><i>📣</i>Standup<span class="bd" id="bd" style="display:none"></span></button><button data-v="all"><i>📚</i>Alle</button><button data-v="more"><i>⚙️</i>Mehr</button>
  </div>
</div>
<button class="ibtn" id="exit" aria-label="Präsentation beenden">✕</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv,.txt,text/csv" style="display:none">
<script src="xlsx.mini.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'standupBoard.v1';
  const DEFCFG = { y: 85, r: 100, stale: 14, base: 'ab', done: 'abgeschlossen, fertig, erledigt, storniert, beendet' };
  let D = { v: 1, rows: [], map: {}, my: '', cfg: Object.assign({}, DEFCFG), loc: {}, imported: '', file: '', demo: false, view: 'stand', who: 'Alle', q: '', sort: 'ampel', showDone: false, calm: false };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { D = Object.assign(D, s); D.cfg = Object.assign({}, DEFCFG, s.cfg || {}); } } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2400); };

  // ---------- Felder & Spaltenzuordnung ----------
  const FIELDS = [
    { k: 'nr', l: 'Auftragsnummer', a: ['auftragsnummer', 'auftragsnr', 'auftragnr'] },
    { k: 'datum', l: 'Auftragsdatum', a: ['auftragsdatum'] },
    { k: 'kunde', l: 'Kunde', a: ['kunde'] },
    { k: 'kom', l: 'Kommission', a: ['kommission', 'bezeichnung', 'projekt'] },
    { k: 'akt', l: 'Aktuelles', a: ['aktuelles', 'aktuell'] },
    { k: 'typ', l: 'Auftrag Typ', a: ['auftragtyp', 'auftragstyp', 'typ'] },
    { k: 'phase', l: 'Phase', a: ['phase'] },
    { k: 'golive', l: 'GoLive Ziel', a: ['golive'] },
    { k: 'pl', l: 'Projektleiter', a: ['projektleiter', 'pl'] },
    { k: 'cons', l: 'Consultant', a: ['consultant', 'berater', 'bearbeiter'] },
    { k: 'status', l: 'Status', a: ['status'] },
    { k: 'plan', l: 'Geplanter abrechenbarer Aufwand (h)', a: ['geplanterabrechenbareraufwand', 'geplanteraufwand', 'plan'] },
    { k: 'ist', l: 'Gebuchter Aufwand (h)', a: ['gebuchteraufwand'] },
    { k: 'istab', l: 'Gebuchter abrechenbarer Aufwand (h)', a: ['gebuchterabrechenbareraufwand'] },
    { k: 'start', l: 'Projekt Start', a: ['projektstart', 'start'] },
    { k: 'ende', l: 'Projekt Ende', a: ['projektende', 'ende'] }
  ];
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\(h\)/g, '').replace(/[^a-z0-9]/g, '');
  function autoMap(header) {
    const nh = header.map(norm), used = new Set(), cols = {};
    const pass = exact => FIELDS.forEach(f => {
      if (cols[f.k] !== undefined) return;
      for (let i = 0; i < nh.length; i++) {
        if (used.has(i) || !nh[i]) continue;
        if (f.a.some(a => exact ? nh[i] === a : nh[i].startsWith(a))) { cols[f.k] = i; used.add(i); return; }
      }
    });
    // gespeicherte Zuordnung (nach Spaltenname) zuerst
    FIELDS.forEach(f => { const s = D.map[f.k]; if (s) { const i = nh.indexOf(s); if (i >= 0 && !used.has(i)) { cols[f.k] = i; used.add(i); } } });
    pass(true); pass(false);
    return cols;
  }

  // ---------- Parser ----------
  function decode(buf) {
    const u = new Uint8Array(buf);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(u).replace(/^﻿/, ''); }
    catch (e) { return new TextDecoder('windows-1252').decode(u); }
  }
  function parseCSV(text) {
    const first = text.slice(0, text.search(/\r?\n/) < 0 ? text.length : text.search(/\r?\n/));
    const cnt = c => first.split(c).length - 1;
    const delim = cnt(';') >= cnt('\t') && cnt(';') >= cnt(',') ? ';' : cnt('\t') >= cnt(',') ? '\t' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function readRows(buf, name) {
    if (/\.(xlsx|xls)$/i.test(name)) {
      const wb = XLSX.read(buf, { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    }
    return parseCSV(decode(buf));
  }
  const pad = n => String(n).padStart(2, '0');
  const isoOf = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  function toISO(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') { if (v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return isoOf(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); } return ''; }
    const s = String(v).trim(); let m;
    if ((m = /^(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})/.exec(s))) return isoOf(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
    if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return s.slice(0, 10);
    if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s))) return isoOf(+m[3], +m[1], +m[2]);
    return '';
  }
  function toNum(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).trim().replace(/\s/g, ''); if (!s) return null;
    if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else s = s.replace(',', '.');
    const n = parseFloat(s); return isFinite(n) ? n : null;
  }
  const str = v => (v == null ? '' : typeof v === 'number' ? String(v) : String(v)).trim();
  function buildRows(raw, hi, cols) {
    const out = [];
    for (let r = hi + 1; r < raw.length; r++) {
      const a = raw[r], g = k => cols[k] === undefined ? '' : a[cols[k]];
      const o = { nr: str(g('nr')), datum: toISO(g('datum')), kunde: str(g('kunde')), kom: str(g('kom')), akt: str(g('akt')), typ: str(g('typ')), phase: str(g('phase')), golive: typeof g('golive') === 'number' ? (toISO(g('golive')) ? fmtD(toISO(g('golive'))) : str(g('golive'))) : str(g('golive')), pl: str(g('pl')).replace(/^Benutzer\s+/i, ''), cons: str(g('cons')).replace(/^Benutzer\s+/i, ''), status: str(g('status')), plan: toNum(g('plan')), ist: toNum(g('ist')), istab: toNum(g('istab')), start: toISO(g('start')), ende: toISO(g('ende')) };
      if (!o.nr && !o.kunde) continue;
      o.id = o.nr || (o.kunde + '|' + o.kom);
      out.push(o);
    }
    return out;
  }

  // ---------- Datum & Ableitungen ----------
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const dOf = iso => iso ? new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) : null;
  const days = (a, b) => Math.round((b - a) / 864e5);
  const fmtD = iso => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';
  const ago = n => n == null ? '' : n <= 0 ? 'heute' : n === 1 ? 'gestern' : 'vor ' + n + ' Tagen';
  function mkDate(d, m, y) {
    const t = today(); let yy = y ? (y.length === 2 ? 2000 + +y : +y) : t.getFullYear();
    let dt = new Date(yy, +m - 1, +d);
    if (!y && dt > new Date(t.getTime() + 14 * 864e5)) dt = new Date(yy - 1, +m - 1, +d);
    return dt;
  }
  function parseAkt(text) {
    const ent = []; let cur = null;
    const re = /^\s*#?\s*(\d{1,2})\.(\d{1,2})(?:\.(\d{4}|\d{2}))?(?!\d)\s*[:\-–—]?\s*(.*)$/;
    String(text || '').split(/\r?\n/).forEach(raw => {
      const l = raw.trim(); if (!l) return;
      const m = re.exec(l);
      if (m && +m[1] >= 1 && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12) { cur = { d: mkDate(m[1], m[2], m[3]), t: m[4] || '' }; ent.push(cur); }
      else if (l.startsWith('#') || !cur) { cur = null; ent.push({ d: null, t: l.replace(/^#\s*/, '') }); }
      else cur.t += (cur.t ? ' ' : '') + l;
    });
    return ent;
  }
  const short = s => String(s || '').replace(/\s*#\d+.*$/, '').trim();
  const isDone = r => { const w = D.cfg.done.toLowerCase().split(',').map(x => x.trim()).filter(Boolean), t = (r.phase + ' ' + r.status).toLowerCase(); return w.some(x => t.includes(x)); };
  const fh = n => n == null ? '–' : (Math.round(n * 10) / 10).toLocaleString('de-DE') + ' h';
  function derive(r) {

    if (!L.mute && !r.akt && !done) flags.push({ s: 'n', t: 'ℹ️ Kein Eintrag bei „Aktuelles“' });
    if (gp != null && r.istab != null && r.ist - r.istab > 0 && (r.ist - r.istab) / Math.max(r.ist, 1) > 0.25 && c.base !== 'ges' && !flags.some(f => f.s !== 'n' && f.t.startsWith('💶'))) flags.push({ s: 'n', t: '🧾 ' + fh(r.ist - r.istab) + ' nicht abrechenbar gebucht' });

  function standText() {
    const list = filtered(all()), t = today();
    const line = p => '- ' + (short(p.r.kunde) || p.r.nr) + (p.r.kom ? ' (' + p.r.kom + ')' : '') + (p.r.cons ? ' [' + p.r.cons.split(' ')[0] + ']' : '') + ': ' + p.flags.filter(f => f.s !== 'n').map(f => f.t.replace(/^\S+\s/, '')).join('; ');
    const L = ['Standup ' + pad(t.getDate()) + '.' + pad(t.getMonth() + 1) + '.' + t.getFullYear() + (D.who !== 'Alle' ? ' – ' + (D.who === 'Meine' ? D.my : D.who) : '')];
    const grp = (s, ttl, f) => { const g = list.filter(p => p.sev === s && !p.L.pin); if (g.length) { L.push('', ttl); g.sort(byAmpel).forEach(p => L.push(line(p))); } };
    const help = list.filter(p => p.L.help); if (help.length) { L.push('', '🆘 Hilfe nötig'); help.forEach(p => L.push('- ' + (short(p.r.kunde) || p.r.nr) + ': ' + p.L.help)); }
    grp('r', '🔴 Rot'); grp('y', '🟡 Gelb');
    const pin = list.filter(p => p.L.pin); if (pin.length) { L.push('', '📌 Fokus heute'); pin.forEach(p => L.push('- ' + (short(p.r.kunde) || p.r.nr) + (p.r.kom ? ' (' + p.r.kom + ')' : ''))); }
    L.push('', '✅ ' + list.filter(p => p.sev === 'g').length + ' Projekte laufen ruhig');
    return L.join('\n');
  }

  // ---------- Events ----------
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { D.view = b.dataset.v; save(); view(); });
  $('im').onclick = () => $('file').click();
  $('cp').onclick = async () => {
    if (!D.rows.length) { toast('Erst Daten importieren'); return; }
    const txt = standText();
    try { await navigator.clipboard.writeText(txt); toast('📋 Standup-Text kopiert'); }
    catch (e) { sheet('<h3>Standup-Text</h3><textarea id="tt" rows="12" readonly>' + esc(txt) + '</textarea><button class="btn sec2" id="tc2">Schließen</button>', () => { $('tt').select(); $('tc2').onclick = closeSheet; }); }
  };
  $('pr').onclick = () => { D.view = 'stand'; view(); document.body.classList.add('pres'); try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {} };
  $('exit').onclick = () => { document.body.classList.remove('pres'); try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} };
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('pres'); });
  $('ov').onclick = e => { if (e.target === $('ov')) closeSheet(); };
  document.addEventListener('gesturestart', e => e.preventDefault());
  if (D.view === 'proj') D.view = 'stand';
  view();
  window.__SB = { get D() { return D; }, parseAkt, derive, toNum, toISO, parseCSV, autoMap, buildRows, standText, loadDemo };
})();
</script>
</body>
